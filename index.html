<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso al Sistema · Mi TNPS</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #f0f3ef;
        --card: #ffffff;
        --border: #c0c5b8;
        --accent: #0a632e;
        --accent2: #2a8b52;
        --text: #151915;
        --muted: #719d88;
    }
    
    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
    }
    
    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Sans', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    
    /* El mismo fondo con destello de tu dashboard */
    body::before {
        content: ''; 
        position: fixed; 
        inset: 0;
        background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(10,99,46,0.08), transparent);
        pointer-events: none; 
        z-index: 0;
    }
    
    .launcher-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px 50px;
        text-align: center;
        position: relative;
        z-index: 10;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        max-width: 420px;
        width: 90%;
        animation: fadeUp 0.5s ease;
    }
    
    .icon-wrap {
        width: 72px; 
        height: 72px; 
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(10,99,46,.18), rgba(42,139,82,.06));
        border: 2px solid rgba(10,99,46,.25);
        margin: 0 auto 20px; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        font-size: 32px;
    }
    
    .title {
        font-family: 'Rajdhani', sans-serif;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }
    
    .subtitle {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 32px;
        line-height: 1.5;
    }
    
    .btn-launch {
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;
        font-size: 16px;
        font-weight: 600;
        font-family: 'DM Sans', sans-serif;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(10,99,46,0.25);
    }
    
    .btn-launch:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(159,122,234,0.4);
    }
    
    .btn-launch:active {
        transform: translateY(1px);
    }
    
    .note {
        font-size: 12px;
        color: var(--muted);
        margin-top: 20px;
        padding: 10px;
        background: rgba(10,99,46,0.04);
        border-radius: 8px;
        border: 1px dashed var(--border);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

    <div class="launcher-card">
        <div class="icon-wrap">🔒</div>
        <h1 class="title">MI TNPS</h1>
        
        <button class="btn-launch" onclick="abrirSistema()">Iniciar Consola Segura →</button>
        
        <div class="note">
            ⚠️ Si es tu primera vez ingresando, asegúrate de permitir las <b>ventanas emergentes (pop-ups)</b> en la barra de tu navegador.
        </div>
    </div>

    <script>
        function abrirSistema() {
            // Parámetros para forzar la apertura como ventana independiente
            // toolbar=no, location=no y menubar=no son los encargados de limpiar la interfaz
            const opciones = "width=1366,height=768,toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes";
            
            // IMPORTANTE: Asegúrate de que el archivo con el código de los supervisores
            // esté guardado exactamente con el nombre 'dashboard.html'
            window.open('dashboard.html', 'TNPS_Dashboard', opciones);
        }
    </script>
</body>
</html>
